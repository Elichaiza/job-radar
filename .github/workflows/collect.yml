name: Collect jobs

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/companies.json
      - data/requests.json
      - docs/lib/**
      - docs/config.js
      - scripts/**

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  # LinkedIn and the careers pages are read by this many machines at once.
  # Each has its own address, which LinkedIn throttles separately.
  SHARDS: 4

jobs:
  part:
    strategy:
      fail-fast: false
      matrix:
        source: [linkedin, careers]
        shard: [0, 1, 2, 3] # one per SHARDS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/${{ matrix.source }}.mjs --out parts/${{ matrix.source }}-${{ matrix.shard }}.json
        env:
          SHARD: ${{ matrix.shard }}/${{ env.SHARDS }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.source }}-${{ matrix.shard }}
          path: parts/
          retention-days: 1

  collect:
    needs: part
    # A failed shard keeps its previous jobs; the rest still count.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - run: node scripts/collect.mjs
        env:
          PARTS: parts
      - name: Publish results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/requests.json data/companies.json data/requests.json data/linkedin-cache.json data/careers-cache.json data/career-pages.json data/sites-cache.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update jobs"
          # The site may have committed (a new company) while we were collecting.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
